name: Android Tag Release

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Verify tag matches versionName
      run: |
        VERSION_NAME=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts)
        TAG="${GITHUB_REF_NAME#v}"
        echo "Tag: $GITHUB_REF_NAME (normalised: $TAG)"
        echo "versionName: $VERSION_NAME"
        if [ -z "$VERSION_NAME" ]; then
          echo "::error::Could not read versionName from app/build.gradle.kts"
          exit 1
        fi
        if [ "$TAG" != "$VERSION_NAME" ]; then
          echo "::error::Tag '$GITHUB_REF_NAME' does not match versionName '$VERSION_NAME' in app/build.gradle.kts"
          exit 1
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    - name: Decode upload keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned build"
          exit 1
        fi
        echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
        echo "RELEASE_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

    - name: Build signed AAB and APK
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        ./gradlew bundleRelease assembleRelease
        mv app/build/outputs/bundle/release/app-release.aab "MyStockManager-$GITHUB_REF_NAME.aab"
        mv app/build/outputs/apk/release/app-release.apk "MyStockManager-$GITHUB_REF_NAME.apk"

    - name: Create GitHub Release and upload builds
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: |
          MyStockManager-${{ github.ref_name }}.aab
          MyStockManager-${{ github.ref_name }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

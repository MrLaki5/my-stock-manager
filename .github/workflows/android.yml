name: Android Tag Release

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Verify tag matches versionName
      run: |
        VERSION_NAME=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts)
        TAG="${GITHUB_REF_NAME#v}"
        echo "Tag: $GITHUB_REF_NAME (normalised: $TAG)"
        echo "versionName: $VERSION_NAME"
        if [ -z "$VERSION_NAME" ]; then
          echo "::error::Could not read versionName from app/build.gradle.kts"
          exit 1
        fi
        if [ "$TAG" != "$VERSION_NAME" ]; then
          echo "::error::Tag '$GITHUB_REF_NAME' does not match versionName '$VERSION_NAME' in app/build.gradle.kts"
          exit 1
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Create GitHub Release and upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
